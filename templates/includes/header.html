{% load static %}
<header>
    <div class="header-container">
        <a href="{% url 'product_list_main' %}" class="header__logo">
            <img src="{% static 'img/logo.svg' %}" alt="Логотип Log Max Russia"><span class="logo-text">Log Max Russia</span>
        </a>
        <nav class="header__nav" aria-label="Основная навигация">
            <ul>
                <li><a href="{% url 'products:product_list' %}">Каталог техники</a></li>
                <li><a href="{% url 'shop:cart' %}">Корзина</a></li>
            </ul>
        </nav>
        {% if not user.is_authenticated %}
        {% url 'login' as login_url %}
        {% url 'register' as register_url %}
        <div class="header-auth-actions">
            {% if login_url %}
            <a href="{{ login_url }}" class="button button--secondary">Войти</a>
            {% else %}
            <button type="button" class="button button--secondary" disabled title="Вход пока недоступен">Войти</button>
            {% endif %}
            {% if register_url %}
            <a href="{{ register_url }}" class="button button--primary">Регистрация</a>
            {% else %}
            <button type="button" class="button button--primary" disabled title="Регистрация пока недоступна">Регистрация</button>
            {% endif %}
        </div>
        {% endif %}
    </div>
</header>
