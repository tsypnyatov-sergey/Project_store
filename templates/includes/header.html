{% load static %}
<header>
    <div class="header-container">
        <a href="{% url 'product_list_main' %}" class="header__logo">
            <img src="{% static 'img/logo.svg' %}" alt="Логотип Log Max Russia"><span class="logo-text">Log Max Russia</span>
        </a>
        <nav class="header__nav" aria-label="Основная навигация">
            <ul>
                <li><a href="{% url 'products:product_list' %}">Каталог техники</a></li>
                <li><a href="{% url 'shop:cart' %}">Корзина</a></li>
            </ul>
        </nav>
        <div class="header-auth-actions">
            {% if user.is_authenticated %}
            <a href="{% url 'account' %}" class="button button--secondary">Личный кабинет</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="button button--primary">Выйти</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}" class="button button--secondary">Войти</a>
            <a href="{% url 'register' %}" class="button button--primary">Регистрация</a>
            {% endif %}
        </div>    </div>
</header>
