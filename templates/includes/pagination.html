<div class="pagination">
    {% if page_obj.has_previous %}
    <a href="{% querystring page=page_obj.previous_page_number %}" class="pagination__link pagination__link--prev">Назад</a>
    {% endif %}
    <div class="pagination-list">
        {% for page in page_obj.paginator.page_range %}
        <a href="{% querystring page=page %}" class="pagination__link{% if page == page_obj.number %} active{% endif %}">{{ page }}</a>
        {% endfor %}
    </div>
    {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}" class="pagination__link pagination__link--next">Далее</a>
    {% endif %}
</div>
