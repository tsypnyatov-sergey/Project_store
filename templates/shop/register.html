{% extends 'base.html' %}
{% block title %}Регистрация | Log Max Russia{% endblock %}
{% block content %}
<section class="container account-page">
    <h1>Регистрация</h1>
    <form method="post" class="shop-form account-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button--primary">Зарегистрироваться</button>
        <a href="{% url 'login' %}">Уже есть аккаунт? Войти</a>
    </form>
</section>
{% endblock %}
